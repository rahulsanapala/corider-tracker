name: iOS Build

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned:
    name: Build unsigned iOS artifacts
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      IOS_AGORA_APP_ID: ${{ secrets.IOS_AGORA_APP_ID }}
      IOS_AGORA_TOKEN: ${{ secrets.IOS_AGORA_TOKEN }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create local iOS config
        working-directory: ios/CoRider
        run: |
          set -euo pipefail

          cat > Config.xcconfig <<EOF
          AGORA_APP_ID = ${IOS_AGORA_APP_ID:-your_agora_app_id_here}
          AGORA_TOKEN = ${IOS_AGORA_TOKEN:-}
          EOF

          if [ -n "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > CoRider/GoogleService-Info.plist
          fi

      - name: Generate Xcode project
        working-directory: ios/CoRider
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios/CoRider
        run: |
          xcodebuild \
            -project CoRider.xcodeproj \
            -scheme CoRider \
            -resolvePackageDependencies

      - name: Build simulator app
        working-directory: ios/CoRider
        run: |
          set -euo pipefail
          xcodebuild \
            -project CoRider.xcodeproj \
            -scheme CoRider \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Run iOS Simulator smoke test
        working-directory: ios/CoRider
        run: |
          set -euo pipefail

          mkdir -p build/artifacts

          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator was found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          touch build/artifacts/smoke-start.marker

          set +e
          xcodebuild \
            -project CoRider.xcodeproj \
            -scheme CoRider \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/artifacts/CoRiderSmoke.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test > build/artifacts/CoRider-simulator-launch.txt 2>&1
          TEST_STATUS=$?
          set -e

          cat build/artifacts/CoRider-simulator-launch.txt

          if [ "$TEST_STATUS" -eq 0 ]; then
            xcrun simctl launch "$SIMULATOR_UDID" com.corider.tracker.ios > build/artifacts/CoRider-simulator-relaunch.txt 2>&1 || true
            sleep 5
          fi

          xcrun simctl io "$SIMULATOR_UDID" screenshot build/artifacts/CoRider-simulator-smoke.png || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show \
            --style compact \
            --last 5m \
            --predicate 'process == "CoRider" OR eventMessage CONTAINS "com.corider.tracker.ios" OR eventMessage CONTAINS "Firebase"' \
            > build/artifacts/CoRider-simulator.log || true

          CRASH_REPORTS="$(find "$HOME/Library/Logs/DiagnosticReports" \( -name 'CoRider*.crash' -o -name 'CoRider*.ips' \) -newer build/artifacts/smoke-start.marker -print 2>/dev/null || true)"
          if [ -n "$CRASH_REPORTS" ]; then
            mkdir -p build/artifacts/crash-reports
            while IFS= read -r report; do
              [ -n "$report" ] && cp "$report" build/artifacts/crash-reports/
            done <<< "$CRASH_REPORTS"
            echo "CoRider crashed during simulator smoke test"
            echo "$CRASH_REPORTS"
            exit 1
          fi

          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "CoRider failed the simulator launch smoke test"
            exit "$TEST_STATUS"
          fi

      - name: Upload simulator smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corider-ios-simulator-smoke-test
          path: |
            ios/CoRider/build/artifacts/CoRider-simulator-launch.txt
            ios/CoRider/build/artifacts/CoRider-simulator-relaunch.txt
            ios/CoRider/build/artifacts/CoRider-simulator-smoke.png
            ios/CoRider/build/artifacts/CoRider-simulator.log
            ios/CoRider/build/artifacts/CoRiderSmoke.xcresult/**
            ios/CoRider/build/artifacts/crash-reports/**
          if-no-files-found: ignore

      - name: Build unsigned iPhone app
        working-directory: ios/CoRider
        run: |
          set -euo pipefail
          xcodebuild \
            -project CoRider.xcodeproj \
            -scheme CoRider \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package artifacts
        working-directory: ios/CoRider
        run: |
          set -euo pipefail

          mkdir -p build/artifacts

          SIMULATOR_APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'CoRider.app' -type d | head -n 1)"
          if [ -z "$SIMULATOR_APP_PATH" ]; then
            echo "CoRider.app was not produced for the simulator"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$SIMULATOR_APP_PATH" build/artifacts/CoRider-simulator-app.zip

          DEVICE_APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -name 'CoRider.app' -type d | head -n 1)"
          if [ -z "$DEVICE_APP_PATH" ]; then
            echo "CoRider.app was not produced for iPhone"
            exit 1
          fi

          rm -rf build/unsigned-ipa
          mkdir -p build/unsigned-ipa/Payload
          ditto "$DEVICE_APP_PATH" build/unsigned-ipa/Payload/CoRider.app
          (
            cd build/unsigned-ipa
            ditto -c -k --sequesterRsrc --keepParent Payload ../artifacts/CoRider-unsigned.ipa
          )

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: corider-ios-simulator-app
          path: ios/CoRider/build/artifacts/CoRider-simulator-app.zip
          if-no-files-found: error

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: corider-ios-unsigned-ipa
          path: ios/CoRider/build/artifacts/CoRider-unsigned.ipa
          if-no-files-found: error
